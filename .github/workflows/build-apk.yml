name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build and Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Secrets & Environment Files
        run: |
          # Ensure root .env and .env.example exist
          touch .env
          echo "GEMINI_API_KEY=" >> .env
          if [ ! -f .env.example ]; then
            touch .env.example
            echo "GEMINI_API_KEY=" >> .env.example
          fi

          # Ensure app/.env exists if app directory is present
          if [ -d "app" ]; then
            touch app/.env
            echo "GEMINI_API_KEY=" >> app/.env
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          # 1. Try decoding from base64 if present
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          
          # 2. If debug.keystore is still missing or empty, generate a fresh one
          if [ ! -s "debug.keystore" ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 3. Copy to app directory as well for subproject resolution safety
          if [ -d "app" ]; then
            cp debug.keystore app/debug.keystore 2>/dev/null || true
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Make Gradle Wrapper Executable
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x ./android/gradlew 2>/dev/null || true

      - name: Build Debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false
          elif [ -f "./android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false
          else
            gradle assembleDebug --stacktrace --no-daemon -Dorg.gradle.configuration-cache=false
          fi

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Viewer-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
